<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie Pookie</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon.svg" alt="" width="28" height="28" />
      <h1>Cookie Pookie</h1>
    </header>

    <div class="warning" id="permission-warning" hidden>
      <p data-i18n="permissionWarning">Cookie Pookie needs access to all websites to reject their cookie banners.</p>
      <button type="button" id="grant" data-i18n="permissionGrant">Allow on all websites</button>
    </div>

    <label class="row">
      <span data-i18n="enabledLabel">Reject cookie banners</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span id="site-label">On <strong>this page</strong></span>
      <input type="checkbox" id="site" />
    </label>

    <p class="stats" id="page-status" data-i18n="statusNone">No cookie banner handled on this page.</p>
    <p class="note" id="total"></p>
    <p class="note" data-i18n="reloadNote">Switch changes apply when you reload the page.</p>

    <button type="button" id="report" data-i18n="reportButton">Report a broken site</button>
    <button type="button" id="manage" class="link" data-i18n="manageSites">Manage sites</button>

    <script src="../i18n.js"></script>
    <script src="../report.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
