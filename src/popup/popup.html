<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cookie Pookie</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon.svg" alt="" width="28" height="28" />
      <h1>Cookie Pookie</h1>
    </header>

    <div class="warning" id="permission-warning" hidden>
      <p>Cookie Pookie needs access to all websites to reject their cookie banners.</p>
      <button type="button" id="grant">Allow on all websites</button>
    </div>

    <label class="row">
      <span>Reject cookie banners</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span>On <strong id="host">this site</strong></span>
      <input type="checkbox" id="site" />
    </label>

    <p class="stats" id="page-status">No cookie banner handled on this page.</p>
    <p class="note" id="total">0 banners handled in total</p>
    <p class="note">Switch changes apply when you reload the page.</p>

    <button type="button" id="report">Report a broken site</button>

    <script src="../report.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
