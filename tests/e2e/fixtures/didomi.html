<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Didomi banner</title>
    <script src="shared.js"></script>
  </head>
  <body>
    <h1>A magazine</h1>
    <p>Some page content.</p>

    <!-- Markup modelled on Didomi's consent notice. -->
    <div id="didomi-host">
      <div id="didomi-notice" class="didomi-notice-banner" data-banner role="dialog" aria-label="Your consent">
        <p>We and our partners store and access information on your device to show personalised ads.</p>
        <button id="didomi-notice-learn-more-button" data-choice="settings">Learn more</button>
        <button id="didomi-notice-disagree-button" data-choice="reject">Disagree and close</button>
        <button id="didomi-notice-agree-button" data-choice="accept">Agree and close</button>
      </div>
    </div>
  </body>
</html>
