<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quantcast banner</title>
    <script src="shared.js"></script>
  </head>
  <body>
    <h1>A recipe site</h1>
    <p>Some page content.</p>

    <!-- Markup modelled on Quantcast Choice, an IAB TCF consent platform. -->
    <div id="qc-cmp2-container">
      <div id="qc-cmp2-main" class="qc-cmp2-main">
        <div id="qc-cmp2-ui" data-banner role="dialog" aria-label="We value your privacy">
          <p>We and our partners store and access personal data, like browsing data, for personalised ads.</p>
          <div class="qc-cmp2-summary-buttons">
            <button mode="secondary" data-choice="settings">More options</button>
            <button id="disagree-btn" mode="secondary" data-choice="reject">Disagree</button>
            <button mode="primary" data-choice="accept">Agree</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
