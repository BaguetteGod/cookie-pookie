<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CookieYes banner</title>
    <script src="shared.js"></script>
  </head>
  <body>
    <h1>A small business</h1>
    <p>Some page content.</p>

    <!-- Markup modelled on CookieYes' consent bar. -->
    <div class="cky-consent-container" data-banner role="region" aria-label="We value your privacy">
      <p>We use cookies to enhance your browsing experience and analyse our traffic.</p>
      <button data-cky-tag="settings-button" data-choice="settings">Customise</button>
      <button data-cky-tag="reject-button" data-choice="reject">Reject All</button>
      <button data-cky-tag="accept-button" data-choice="accept">Accept All</button>
    </div>
  </body>
</html>
