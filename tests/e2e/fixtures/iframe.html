<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banner in an iframe</title>
    <style>
      iframe {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 160px;
        border: 0;
        border-top: 1px solid #ccc;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>A magazine</h1>
    <p>Some page content.</p>
    <!-- Many platforms load their banner in an iframe. -->
    <iframe id="consent-frame" src="iframe-banner.html" title="Consent"></iframe>
  </body>
</html>
