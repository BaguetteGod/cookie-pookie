name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Puppeteer downloads Chrome by default; only Firefox is needed here.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev tools
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Mozilla add-on linter
        run: npm run lint

      - name: Install Firefox
        run: npx puppeteer browsers install firefox@stable

      - name: End-to-end tests in Firefox
        run: npm run test:e2e
